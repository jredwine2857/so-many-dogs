name: Infra plan

# Runs on every PR that touches infrastructure. Read-only: it shows what
# would change and posts the plan on the PR. Nothing is applied here.
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-plan.yml"

permissions:
  contents: read
  id-token: write # required to fetch the OIDC token for AWS
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.5

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Format check
        run: tofu -chdir=infra fmt -check -recursive

      - name: Init
        run: tofu -chdir=infra init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Validate
        run: tofu -chdir=infra validate

      - name: Plan
        id: plan
        run: |
          set -o pipefail
          tofu -chdir=infra plan -no-color -input=false | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('plan.txt', 'utf8');
            // GitHub comments cap at 65536 characters.
            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n\n...truncated, see the workflow logs for the full plan.';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### OpenTofu plan\n\n<details><summary>Show plan</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n\n</details>`,
            });
