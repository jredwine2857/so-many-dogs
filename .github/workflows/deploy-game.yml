name: Deploy game

# Ships the game itself. Assumes the infra already exists — run Infra apply
# first, since this reads its outputs to find where to deploy.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - ".github/workflows/deploy-game.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-game
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.5

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Where to deploy is whatever the infra stack actually built — no
      # duplicated resource names to drift out of sync.
      - name: Read infra outputs
        id: infra
        run: |
          tofu -chdir=infra init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          {
            echo "ecr_repo=$(tofu -chdir=infra output -raw ecr_repository_url)"
            echo "instance_id=$(tofu -chdir=infra output -raw instance_id)"
            echo "client_bucket=$(tofu -chdir=infra output -raw client_bucket)"
            echo "distribution_id=$(tofu -chdir=infra output -raw client_distribution_id)"
            echo "server_url=$(tofu -chdir=infra output -raw game_server_url)"
          } >> "$GITHUB_OUTPUT"

      # --- server ---------------------------------------------------------

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push server image
        run: |
          IMAGE="${{ steps.infra.outputs.ecr_repo }}:${{ github.sha }}"
          docker build -f server/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # SSM runs the deploy script that user_data installed on the instance.
      # No SSH, no inbound port, no self-hosted runner on the game box.
      - name: Deploy server via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.infra.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ github.sha }}" \
            --parameters commands="/usr/local/bin/deploy-game.sh $IMAGE" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.infra.outputs.instance_id }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) echo "deploy succeeded"; break ;;
              Failed|Cancelled|TimedOut)
                echo "deploy $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ steps.infra.outputs.instance_id }}" \
                  --query "StandardErrorContent" --output text
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done

      # Hit the same CloudFront path the players will, so this proves the
      # whole chain works — CloudFront, security group, container — not just
      # that a container is running somewhere.
      - name: Verify server is healthy
        run: |
          HEALTH="$(echo '${{ steps.infra.outputs.server_url }}' | sed 's|^wss://|https://|')/healthz"
          echo "checking $HEALTH"
          for i in $(seq 1 30); do
            if curl -sf "$HEALTH" > /dev/null; then
              echo "server healthy"; exit 0
            fi
            sleep 5
          done
          echo "server did not come back healthy at $HEALTH"; exit 1

      # --- client ---------------------------------------------------------

      - name: Build client
        env:
          # Points the browser at the CloudFront distribution in front of the
          # game server, so the socket is wss:// and not blocked as mixed
          # content by the HTTPS page.
          VITE_SERVER_URL: ${{ steps.infra.outputs.server_url }}
        run: |
          npm ci --prefix client
          npm run build --prefix client

      - name: Sync client to S3
        run: |
          # Hashed assets can cache forever; index.html must not, or players
          # keep loading an old build after a deploy.
          aws s3 sync client/dist "s3://${{ steps.infra.outputs.client_bucket }}" \
            --delete --exclude "index.html" --cache-control "public,max-age=31536000,immutable"
          aws s3 cp client/dist/index.html "s3://${{ steps.infra.outputs.client_bucket }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.infra.outputs.distribution_id }}" \
            --paths "/*" > /dev/null

      - name: Summary
        run: |
          {
            echo "### Deployed \`${{ github.sha }}\`"
            echo ""
            echo "Play here: $(tofu -chdir=infra output -raw play_url)"
          } >> "$GITHUB_STEP_SUMMARY"
